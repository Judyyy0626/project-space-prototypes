<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件预览</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;background:#f4f6fb;color:#20242c;margin:0;padding:24px}
.page{max-width:920px;margin:0 auto}
.card{background:#fff;border:1px solid #e5e8ef;border-radius:14px;box-shadow:0 12px 30px rgba(31,35,48,.08);padding:22px}
h1{font-size:20px;margin-bottom:6px;word-break:break-all}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.badge{display:inline-flex;padding:4px 9px;border-radius:6px;background:#f3f4f6;color:#4b5563;font-size:12px}
.box{background:#f9fafb;border:1px dashed #d1d5db;border-radius:12px;padding:24px;text-align:center}
.box b{display:block;font-size:15px;margin-bottom:6px}
.box p{font-size:13px;color:#6b7280;line-height:1.6;margin:0}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{display:inline-flex;border-radius:8px;padding:8px 12px;font-size:13px;text-decoration:none;border:1px solid #d1d5db;background:#fff;color:#374151}
.btn.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <h1 id="fileName">文件预览</h1>
    <div class="meta">
      <span class="badge" id="fileType">文件</span>
      <span class="badge" id="fileSource">来源</span>
      <span class="badge" id="fileTime">更新时间</span>
    </div>
    <div class="box">
      <b>原型预览占位</b>
      <p>该文件内容未接入真实文件存储。正式版本将在此解析 Excel / PDF / Word 内容，并支持表格预览、下载和权限校验。</p>
    </div>
    <div class="actions">
      <button class="btn" onclick="window.close()">关闭</button>
      <button class="btn primary" onclick="alert('原型内不触发真实下载。')">下载</button>
    </div>
  </div>
</div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('fileName').textContent=q.get('name')||'文件预览';
document.getElementById('fileType').textContent=q.get('type')||'文件';
document.getElementById('fileSource').textContent=q.get('source')||'来源';
document.getElementById('fileTime').textContent=q.get('updatedAt')||'更新时间';
document.title=(q.get('name')||'文件预览')+' · 预览';
</script>
</body>
</html>

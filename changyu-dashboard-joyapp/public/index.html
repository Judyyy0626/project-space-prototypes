<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI经营中心 · 跳转中</title>
<style>
:root{--brand:#4f46e5;--ink:#20242c;--sub:#6b7280}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;background:#f4f6fb;color:var(--ink);display:grid;place-items:center;height:100vh;margin:0}
.box{text-align:center}
.logo{font-weight:800;font-size:22px;color:var(--brand);margin-bottom:10px}
.tip{font-size:14px;color:var(--sub);margin-bottom:18px}
a{color:var(--brand);font-size:14px;text-decoration:none;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:9px 18px;display:inline-block}
a:hover{border-color:var(--brand)}
</style>
<script>setTimeout(function(){location.replace('templates.html')},1200)</script>
</head>
<body>
<div class="box">
  <div class="logo">AI经营中心</div>
  <div class="tip">项目列表已迁移至 templates.html，正在为你跳转…</div>
  <a href="templates.html">如果没有自动跳转，点这里进入</a>
</div>
</body>
</html>
